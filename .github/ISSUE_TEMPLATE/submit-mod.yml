name: Submit a mod
description: Ask for your mod to be added to the Echo VR launcher.
title: "Submit: <mod id>"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Before you submit, your mod's repo needs a GitHub release made by the
        [template's](https://github.com/EchoTools/echo-mod-template-repo) release workflow.
        A check runs on this issue and comments what it found. Edit the issue (or comment `/check`)
        to run it again after a new release.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: Your mod's public GitHub repository.
      placeholder: https://github.com/you/my-cool-mod
    validations:
      required: true
  - type: input
    id: mod_id
    attributes:
      label: Mod id
      description: The `id` in your echo-mod.json.
      placeholder: my-cool-mod
    validations:
      required: true
  - type: input
    id: echovrce
    attributes:
      label: EchoVRCE username
      description: Your username on EchoVRCE (the one players see), so we know who you are there. Like everything in this issue, it is public.
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: What does it do?
      description: A few sentences for the reviewer, and anything the code doesn't make obvious (what it hooks, what it sends where).
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Optional. One per line: an https:// link, a `|`, and what it shows. Up to 8. They go in your listing in the launcher's plugin browser."
      placeholder: "https://example.com/menu.png | The mod's menu in the lobby"
  - type: input
    id: video
    attributes:
      label: Video
      description: Optional. One https:// link to a video of the mod.
  - type: textarea
    id: credits
    attributes:
      label: Credits
      description: "Everyone whose work the mod builds on, one per line: name, a `|`, what they did, and optionally a `|` and a link. Include yourself."
      placeholder: "Dualgame | Wrote the original rad-links | https://github.com/Dualgame"
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: The mod is no cheat, collects no player data, and its capabilities say what it does.
          required: true
        - label: The source is public under an open-source license, and the launcher may redistribute its releases.
          required: true
        - label: I made this mod or may submit it for its authors.
          required: true
        - label: Everyone whose work the mod builds on is named in Credits, and their license files are in the repo.
          required: true
