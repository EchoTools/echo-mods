# The submission form's field parsing. Runs no submitted code and holds no secrets.
name: submission fields tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  submission-fields-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s tests -k test_submission_fields -v
